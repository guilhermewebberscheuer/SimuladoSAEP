<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Academia</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f1f4f8; color: #202938; }
    main { width: min(92vw, 380px); padding: 28px; background: white; border-radius: 12px; box-shadow: 0 8px 28px #00000012; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input, button { width: 100%; padding: 12px; border-radius: 7px; font: inherit; }
    input { border: 1px solid #c8d0dc; }
    button { margin-top: 20px; border: 0; background: #2457a7; color: white; font-weight: 700; cursor: pointer; }
    #mensagem { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Entrar no sistema</h1>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="mensagem" role="status"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#form-login');
    const mensagem = document.querySelector('#mensagem');
    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mensagem.textContent = 'Verificando...';
      try {
        const resposta = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.querySelector('#email').value,
            senha: document.querySelector('#senha').value
          })
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.mensagem || 'Não foi possível entrar.');
        // Apenas demonstração para esta etapa; a próxima etapa fará a tela principal.
        sessionStorage.setItem('token', dados.token);
        sessionStorage.setItem('usuario', JSON.stringify(dados.usuario));
        mensagem.textContent = `Login realizado! Olá, ${dados.usuario.nome}. O token expira em ${dados.expiraEm}.`;
      } catch (erro) {
        mensagem.textContent = erro.message;
      }
    });
  </script>
</body>
</html>
