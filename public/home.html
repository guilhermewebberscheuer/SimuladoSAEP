
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia - Página Inicial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #263746;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            padding: 30px;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 200px;
            box-shadow: 0 2px 6px #ccc;
        }

        a {
            color: #1769aa;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Academia</h1>
            <p>Bem-vindo(a), <strong id="nomeUsuario">Usuário</strong>!</p>
        </div>

        <button id="btnSair">Sair</button>
    </header>

    <main>
        <h2>Página inicial</h2>
        <p>Selecione uma funcionalidade:</p>

        <div class="menu">
            <section class="card">
                <h3>Alunos</h3>
                <p>Cadastro e consulta de alunos.</p>
                <a href="alunos.html">Acessar</a>
            </section>

            <section class="card">
                <h3>Planos de treino</h3>
                <p>Gerenciamento dos planos.</p>
                <a href="planos.html">Acessar</a>
            </section>

            <section class="card">
                <h3>Agendamentos</h3>
                <p>Consulta e atualização das aulas.</p>
                <a href="agendamentos.html">Acessar</a>
            </section>
        </div>
    </main>

    <script>
        const token = localStorage.getItem("token");
        const nome = localStorage.getItem("nomeUsuario");

        if (!token) {
            window.location.href = "/login.html";
        } else {
            document.getElementById("nomeUsuario").textContent =
                nome || "Usuário";
        }

        document.getElementById("btnSair").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("nomeUsuario");
            window.location.href = "/login.html";
        });
    </script>
</body>
</html>
